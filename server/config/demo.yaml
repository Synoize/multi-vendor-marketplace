# Production configuration - Hostinger
# Fill in your real credentials. You can also override any of these at
# runtime using environment variables (used in src/database/connection.js):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD

app:
  name: "The Damini Edit API"
  version: "1.0.0"
  env: "production"
  port: 5000 # Must match the port set in Hostinger hPanel Node.js settings
  clientUrl: ""
  vendorUrl: ""
  adminUrl: ""
  adsUrl: ""
  uploadDir: "uploads"
  maxFileSize: 5242880 # 5MB

database:
  host: "localhost"
  port: 3306
  name: "" # e.g. u123456789_damini
  user: "" # e.g. u123456789_damini
  password: ""
  connectionLimit: 25
  charset: "utf8mb4"

jwt:
  accessSecret: ""
  refreshSecret: ""
  accessExpiry: ""
  refreshExpiry: ""
  cookieMaxAge: # 2 days in ms

# Production rate limits. Only overrides the default values that must be
# tighter in production; every policy still has a value from default.yaml.
rateLimit:
  enabled: true

  global:
    windowMs: 60000
    max: 300

  read:
    windowMs: 60000
    max: 120

  write:
    windowMs: 60000
    max: 40

  auth:
    windowMs: 900000
    max: 5

  otp:
    windowMs: 600000
    max: 3

  order:
    windowMs: 60000
    max: 10

  payment:
    windowMs: 60000
    max: 5

  upload:
    windowMs: 60000
    max: 15

cors:
  origins:
    - ""

mail:
  host: ""
  port:
  secure: true
  user: ""
  password: ""
  from: "The Damini Edit "

razorpay:
  keyId: ""
  keySecret: ""
  webhookSecret: ""

shiprocket:
  email: ""
  password: ""
  channelId: ""
  baseUrl: "https://apiv2.shiprocket.in/v1/external"
  pickupEnabled: true

# Delivery day estimates (in days) for the pincode delivery check.
delivery:
  localDays: 3
  sameStateDays: 5
  crossStateDays: 7
  defaultDays: 9


commission:
  defaultRate: 3 # 5% platform commission

referral:
  rewardAmount: 100 # Rs.100 per successful referral
