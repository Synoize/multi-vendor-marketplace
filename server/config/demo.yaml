# Production configuration - Hostinger
# Fill in your real credentials. You can also override any of these at
# runtime using environment variables (used in src/database/connection.js):
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD

app:
  name: "The Damini Edit API"
  version: "0.0"
  env: " "
  port: 2000 # Must match the port set in Hostinger hPanel Node.js settings
  clientUrl: " "
  vendorUrl: " "
  adminUrl: " "
  adsUrl: " "
  uploadDir: " "
  maxFileSize: 1111111111 # 5MB

database:
  host: " " # if use ip 148.222.53.74
  port:
  name: " " # e.g. u123456789_damini
  user: " " # e.g. u123456789_damini
  password: " "
  connectionLimit:
  charset: " "

jwt:
  accessSecret: " "
  refreshSecret: " "
  accessExpiry: "1d"
  refreshExpiry: "1d"
  cookieMaxAge: 1 # 2 days in ms

# Production rate limits. Only overrides the default values that must be
# tighter in production; every policy still has a value from default.yaml.
rateLimit:
  enabled: true

  global:
    windowMs: 10000
    max: 100

  read:
    windowMs: 10000
    max: 110

  write:
    windowMs: 10000
    max: 11

  auth:
    windowMs: 100000
    max: 1

  otp:
    windowMs: 100000
    max: 1

  order:
    windowMs: 10000
    max: 1

  payment:
    windowMs: 10000
    max: 1

  upload:
    windowMs: 10000
    max: 1

cors:
  origins:
    - " "

mail:
  host: " "
  port:
  secure: true
  user: " "
  password: " "
  from: ""

razorpay:
  keyId: ""
  keySecret: ""
  webhookSecret: ""

shiprocket:
  email: ""
  password: ""
  channelId: ""
  baseUrl: ""
  pickupEnabled: true

# Delivery day estimates (in days) for the pincode delivery check.
delivery:
  localDays: 3
  sameStateDays: 5
  crossStateDays: 7
  defaultDays: 9

commission:
  defaultRate: 3 # 5% platform commission

referral:
  rewardAmount: 100 # Rs.100 per successful referral
