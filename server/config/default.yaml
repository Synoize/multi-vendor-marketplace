# Policy-based rate limiting.
# - `enabled` controls whether any limiter is active at all.
# - Each named policy defines windowMs (window) + max (requests per window).
# - The `global` policy is the whole-API safety net applied to /api/v1.
# - The `dev` block is used automatically when NODE_ENV is development/test and
#   provides relaxed limits so local work is not blocked (limiting stays ON).
# In-memory store: limits are per process and reset on restart.
rateLimit:
  enabled: true

  global:
    windowMs: 60000 # 1 minute
    max: 300

  read:
    windowMs: 60000
    max: 180

  write:
    windowMs: 60000
    max: 60

  search:
    windowMs: 60000
    max: 60

  auth:
    windowMs: 900000 # 15 minutes
    max: 10

  otp:
    windowMs: 600000 # 10 minutes
    max: 5

  cart:
    windowMs: 60000
    max: 100

  order:
    windowMs: 60000
    max: 10

  payment:
    windowMs: 60000
    max: 5

  coupon:
    windowMs: 60000
    max: 20

  review:
    windowMs: 3600000 # 1 hour
    max: 10

  upload:
    windowMs: 60000
    max: 20

  admin:
    windowMs: 60000
    max: 60

  # Relaxed limits for development/test so rate limiting stays enabled but
  # never blocks local work. Overrides the matching policy window/limits.
  dev:
    global:
      windowMs: 60000
      max: 5000
    read:
      windowMs: 60000
      max: 1000
    write:
      windowMs: 60000
      max: 500
    search:
      windowMs: 60000
      max: 500
    auth:
      windowMs: 60000
      max: 100
    otp:
      windowMs: 60000
      max: 100
    cart:
      windowMs: 60000
      max: 500
    order:
      windowMs: 60000
      max: 100
    payment:
      windowMs: 60000
      max: 100
    coupon:
      windowMs: 60000
      max: 100
    review:
      windowMs: 3600000
      max: 100
    upload:
      windowMs: 60000
      max: 100
    admin:
      windowMs: 60000
      max: 300

