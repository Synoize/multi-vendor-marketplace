# Delivery day estimates (in days) for the pincode delivery check.
# Values can be overridden at runtime with the matching DELIVERY_* env vars.
delivery:
  localDays: 3 # same district / very close (DELIVERY_LOCAL_DAYS)
  sameStateDays: 5 # same state (DELIVERY_SAME_STATE_DAYS)
  crossStateDays: 7 # different states (DELIVERY_CROSS_STATE_DAYS)
  defaultDays: 9 # pickup pincode unknown / failed to resolve (DELIVERY_DEFAULT_DAYS)

commission:
