<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2874F0" />
    <meta
      name="description"
      content="Damini - India's Favourite Multi-Vendor Marketplace. Shop millions of products from verified sellers. Best prices, fast delivery, easy returns."
    />
    <meta
      name="keywords"
      content="Damini, online shopping, marketplace, electronics, fashion, home, India"
    />
    <meta
      property="og:title"
      content="Damini - India's Favourite Marketplace"
    />
    <meta
      property="og:description"
      content="Shop millions of products from verified sellers."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>The Damini Edit - India's Favourite Marketplace</title>
  </head>
  <body class="antialiased">
    <div id="html-splash" style="position:fixed;inset:0;z-index:9998;background:#9F0202;display:flex;align-items:center;justify-content:center;">
      <img src="/logo.jpeg" alt="Damini" style="width:112px;height:auto;animation:splashZoom 2s ease-in-out infinite;" />
    </div>
    <script>
      (function(){
        var done=false, loaded=false;
        function check(){if(done&&loaded){var el=document.getElementById('html-splash');if(el)el.remove();}}
        setTimeout(function(){done=true;check();},2500);
        if(document.readyState==='complete'){loaded=true;check();}
        else window.addEventListener('load',function(){loaded=true;check();});
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
