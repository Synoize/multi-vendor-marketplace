<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2874F0" />

    <meta
      name="description"
      content="Seller Hub by The Damini Edit - Manage your online store, products, orders, inventory, payments, analytics, and grow your business from one powerful dashboard."
    />

    <meta
      name="keywords"
      content="Seller Hub, The Damini Edit Seller, Seller Dashboard, Vendor Portal, Marketplace Seller, Product Management, Order Management, Inventory, Analytics, India"
    />

    <meta property="og:title" content="Seller Hub - The Damini Edit" />

    <meta
      property="og:description"
      content="Manage products, orders, inventory, payments, and business analytics from your Seller Hub."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Damini Edit" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Seller Hub - The Damini Edit" />

    <meta
      name="twitter:description"
      content="Powerful seller dashboard to manage your business on The Damini Edit."
    />

    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Seller Hub | The Damini Edit</title>
  </head>
  <body class="antialiased">
    <div
      id="html-splash"
      class="fixed inset-0 z-[99999] flex h-screen w-full items-center justify-center bg-[#9F0202] opacity-100 transition-opacity duration-300"
    >
      <img
        src="/logo-icon.png"
        alt="The Damini Edit"
        class="h-auto w-28 animate-pulse"
      />
    </div>

    <div id="root"></div>

    <script>
      (() => {
        const splash = document.getElementById("html-splash");

        let pageLoaded = false;
        let minimumTimePassed = false;

        function hideSplash() {
          if (!pageLoaded || !minimumTimePassed) return;

          splash.classList.add("opacity-0");

          setTimeout(() => {
            splash.remove();
          }, 300);
        }

        // Wait until complete page is loaded
        window.addEventListener("load", () => {
          pageLoaded = true;
          hideSplash();
        });

        // Loader must stay for at least 2 seconds
        setTimeout(() => {
          minimumTimePassed = true;
          hideSplash();
        }, 2500);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
